<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{ static('icon.svg') }}" type="image/svg+xml">
<title>{% block title %}{{ app.config.title }}{% endblock %} · {{ app.config.title }}</title>
<link rel="stylesheet" href="{{ static('app.css') }}">
{% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
<header class="top">
  <a class="brand" href="/">{{ app.config.title }}</a>
  <nav>
    <a href="/" data-match="/ /m/">Map</a>
    <a href="/things" data-match="/things">Things</a>
    <a href="/places" data-match="/places">Places</a>
    <a href="/stock" data-match="/stock">Stock{% set low = app.low_count() %}{% if low %} <span class="count low" title="at or below reorder level">{{ low }}</span>{% endif %}</a>
    {% set n = app.warning_count() %}{% if n %}<a href="/lint" data-match="/lint">Problems <span class="count">{{ n }}</span></a>{% endif %}
  </nav>
  <form action="/search" class="search" role="search">
    <input type="search" name="q" placeholder="Where is…?" value="{{ q|default('') }}" list="allnames" autocomplete="off" id="q">
    <input type="hidden" name="go" value="1">
    <datalist id="allnames"></datalist>
  </form>
</header>
<main>
{% block main %}{% endblock %}
</main>
<script src="{{ static('app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
